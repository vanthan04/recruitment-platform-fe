name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    env:
      # lib/constants/service.ts throws at import time in a production build
      # if this is unset — `next build` sets NODE_ENV=production internally,
      # and Next's "Collecting page data" step imports every route module
      # (including ones that pull this in transitively) even though nothing
      # here actually calls the backend. Any reachable-looking value works;
      # this build never makes a real request.
      BACKEND_URL: http://ci-placeholder:8080
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Blocking: the tree is currently clean at this threshold (verified
      # 2026-09-12), so this can't false-fail. If a future high/critical
      # advisory lands with no non-breaking fix, drop back to
      # `continue-on-error: true` with a comment naming the specific
      # unfixable advisory — not as a blanket default.
      - run: npm audit --audit-level=high
      - run: npm run lint
      # `next build` writes ambient route types (e.g. LayoutProps) to
      # .next/types/ — tsc needs that to exist first, so build runs before
      # typecheck. A fresh checkout has no .next/ at all otherwise, and
      # `tsc --noEmit` fails on every layout.tsx/page.tsx with "Cannot find
      # name 'LayoutProps'"/"'PageProps'" even though the code is correct.
      - run: npm run build
      - run: npm run typecheck
      - run: npm test
