name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Report-only: surface known-vulnerable dependencies without blocking
      # the build on transitive advisories the team hasn't triaged yet.
      - run: npm audit --audit-level=high
        continue-on-error: true
      - run: npm run lint
      # `next build` writes ambient route types (e.g. LayoutProps) to
      # .next/types/ — tsc needs that to exist first, so build runs before
      # typecheck. A fresh checkout has no .next/ at all otherwise, and
      # `tsc --noEmit` fails on every layout.tsx/page.tsx with "Cannot find
      # name 'LayoutProps'"/"'PageProps'" even though the code is correct.
      - run: npm run build
      - run: npm run typecheck
      - run: npm test
